services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag}
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: valkey/valkey:8.0.2-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: quay.io/minio/minio:RELEASE.2024-07-16T23-46-41Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-local-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-change-me-local-only}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms768m -Xmx768m"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.105.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/otel/collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"

  kiwix:
    image: ghcr.io/kiwix/kiwix-serve:3.8.2
    command: ["*.zim"]
    ports:
      - "8083:8080"
    volumes:
      - ./zim:/data:ro

  xberg:
    image: ghcr.io/xberg-io/xberg:1.0.3
    command: serve --host 0.0.0.0 --port 8000
    environment:
      XBERG_CORS_ORIGINS: "http://localhost:5173"
      XBERG_MAX_UPLOAD_SIZE_MB: "100"
      RUST_LOG: info
    ports:
      - "8091:8000"
    volumes:
      - xberg-cache:/app/.xberg
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1024m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "xberg --help >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  docling:
    image: quay.io/docling-project/docling-serve-cpu:v1.28.0
    environment:
      UVICORN_HOST: 0.0.0.0
      UVICORN_PORT: "5001"
      DOCLING_DEVICE: cpu
      DOCLING_SERVE_ENABLE_UI: "false"
      DOCLING_SERVE_MAX_FILE_SIZE: "104857600"
    ports:
      - "8092:5001"
    volumes:
      - docling-cache:/root/.cache
    read_only: true
    tmpfs:
      - /tmp:size=1024m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 4096m
    cpus: 2.0
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5001/health', timeout=5).read()\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 10

  metadata-service:
    build:
      context: .
      dockerfile: infra/docker/python.Dockerfile
    command: python -m wikipediarag.metadata_app
    environment:
      APP_ENV: development
    ports:
      - "8090:8090"

  mock-provider:
    build:
      context: .
      dockerfile: infra/docker/python.Dockerfile
    command: python -m wikipediarag.mock_provider_app
    environment:
      APP_ENV: development
      MOCK_PROVIDER_CHAT_DELAY_SECONDS: ${MOCK_PROVIDER_CHAT_DELAY_SECONDS:-0}
      MOCK_PROVIDER_CHAT_DELAY_REQUESTS: ${MOCK_PROVIDER_CHAT_DELAY_REQUESTS:-0}
      MOCK_PROVIDER_OUTPUT_MODE: ${MOCK_PROVIDER_OUTPUT_MODE:-normal}
    ports:
      - "8082:8080"

  model-gateway:
    build:
      context: .
      dockerfile: infra/docker/python.Dockerfile
    command: python -m wikipediarag.gateway_app
    environment:
      MODEL_PROVIDER: ${MODEL_PROVIDER:-mock}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://rag:change-me-local-only@postgres:5432/rag}
      MODEL_GATEWAY_STARTUP_SMOKE: ${MODEL_GATEWAY_STARTUP_SMOKE:-warn}
      RETRIEVAL_PROFILE: ${RETRIEVAL_PROFILE:-test_mock}
      MODELS_CONFIG_PATH: ${MODELS_CONFIG_PATH:-/app/config/models.yaml}
      RETRIEVAL_CONFIG_PATH: ${RETRIEVAL_CONFIG_PATH:-/app/config/retrieval.yaml}
      MOCK_PROVIDER_URL: http://mock-provider:8080
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      MODEL_PROVIDER_TIMEOUT_SECONDS: ${MODEL_PROVIDER_TIMEOUT_SECONDS:-180}
      DEPENDENCY_CIRCUIT_FAILURE_THRESHOLD: ${DEPENDENCY_CIRCUIT_FAILURE_THRESHOLD:-3}
      DEPENDENCY_CIRCUIT_COOLDOWN_SECONDS: ${DEPENDENCY_CIRCUIT_COOLDOWN_SECONDS:-15}
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mock-provider:
        condition: service_started

  api:
    build:
      context: .
      dockerfile: infra/docker/python.Dockerfile
    command: python -m wikipediarag.api_app
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://rag:change-me-local-only@postgres:5432/rag}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-local-minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-change-me-local-only}
      MINIO_BUCKET: ${MINIO_BUCKET:-rag-artifacts}
      OPENSEARCH_URL: ${OPENSEARCH_URL:-http://opensearch:9200}
      MODEL_GATEWAY_URL: ${MODEL_GATEWAY_URL:-http://model-gateway:8080}
      MODEL_CLIENT_CHAT_TIMEOUT_SECONDS: ${MODEL_CLIENT_CHAT_TIMEOUT_SECONDS:-300}
      CHAT_RUN_DEADLINE_SECONDS: ${CHAT_RUN_DEADLINE_SECONDS:-300}
      OPERATION_HEARTBEAT_SECONDS: ${OPERATION_HEARTBEAT_SECONDS:-10}
      DEPENDENCY_CIRCUIT_FAILURE_THRESHOLD: ${DEPENDENCY_CIRCUIT_FAILURE_THRESHOLD:-3}
      DEPENDENCY_CIRCUIT_COOLDOWN_SECONDS: ${DEPENDENCY_CIRCUIT_COOLDOWN_SECONDS:-15}
      IDEMPOTENCY_RECORD_TTL_SECONDS: ${IDEMPOTENCY_RECORD_TTL_SECONDS:-86400}
      SAFE_EXTERNAL_RETRY_ATTEMPTS: ${SAFE_EXTERNAL_RETRY_ATTEMPTS:-2}
      API_PUBLIC_BASE_URL: ${API_PUBLIC_BASE_URL:-http://localhost:8000}
      XBERG_URL: ${XBERG_URL:-http://xberg:8000}
      XBERG_URLS: ${XBERG_URLS:-}
      DOCLING_URL: ${DOCLING_URL:-http://docling:5001}
      DOCLING_URLS: ${DOCLING_URLS:-}
      METADATA_SERVICE_URL: ${METADATA_SERVICE_URL:-http://metadata-service:8090}
      DOCUMENT_PARSER_SERVICES_REQUIRED: ${DOCUMENT_PARSER_SERVICES_REQUIRED:-false}
      DOCUMENT_PARSER_XBERG_CONCURRENCY: ${DOCUMENT_PARSER_XBERG_CONCURRENCY:-2}
      DOCUMENT_PARSER_DOCLING_CONCURRENCY: ${DOCUMENT_PARSER_DOCLING_CONCURRENCY:-1}
      RETRIEVAL_PROFILE: ${RETRIEVAL_PROFILE:-test_mock}
      DOCUMENT_SOFT_DELETE_RETENTION_DAYS: ${DOCUMENT_SOFT_DELETE_RETENTION_DAYS:-30}
      MODELS_CONFIG_PATH: ${MODELS_CONFIG_PATH:-/app/config/models.yaml}
      RETRIEVAL_CONFIG_PATH: ${RETRIEVAL_CONFIG_PATH:-/app/config/retrieval.yaml}
      WIKI_XML_PATH: ${WIKI_XML_PATH:-/data/ruwiki-20260701-pages-articles-multistream.xml.bz2}
      WIKI_INDEX_PATH: ${WIKI_INDEX_PATH:-/data/ruwiki-20260701-pages-articles-multistream-index.txt.bz2}
      ZIM_DIR: ${ZIM_DIR:-/zim}
      ZIM_FILENAME: ${ZIM_FILENAME:-}
      KIWIX_PUBLIC_BASE_URL: ${KIWIX_PUBLIC_BASE_URL:-http://localhost:8083}
      KIWIX_INTERNAL_BASE_URL: ${KIWIX_INTERNAL_BASE_URL:-http://kiwix:8080}
      KIWIX_BOOK_NAME: ${KIWIX_BOOK_NAME:-}
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
      AUTH_MODE: ${AUTH_MODE:-local}
      APP_SECRET_FILE: ${APP_SECRET_FILE:-/run/secrets/app_secret}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-admin}
      BOOTSTRAP_ADMIN_PASSWORD_FILE: ${BOOTSTRAP_ADMIN_PASSWORD_FILE:-/run/secrets/bootstrap_admin_password}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-wikipediarag_session}
      SESSION_IDLE_SECONDS: ${SESSION_IDLE_SECONDS:-2592000}
      SESSION_MAX_SECONDS: ${SESSION_MAX_SECONDS:-2592000}
      REMEMBER_ME_IDLE_SECONDS: ${REMEMBER_ME_IDLE_SECONDS:-2592000}
      REMEMBER_ME_MAX_SECONDS: ${REMEMBER_ME_MAX_SECONDS:-7776000}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-lax}
      OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET_FILE: ${OIDC_CLIENT_SECRET_FILE:-/run/secrets/oidc_client_secret}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-http://localhost:8000/api/v1/auth/oidc/callback}
      OIDC_SCOPE: ${OIDC_SCOPE:-openid profile email}
      OIDC_CLAIM_SUB: ${OIDC_CLAIM_SUB:-sub}
      OIDC_CLAIM_USERNAME: ${OIDC_CLAIM_USERNAME:-preferred_username}
      OIDC_CLAIM_NAME: ${OIDC_CLAIM_NAME:-name}
      OIDC_CLAIM_EMAIL: ${OIDC_CLAIM_EMAIL:-email}
      OIDC_CLAIM_EMAIL_VERIFIED: ${OIDC_CLAIM_EMAIL_VERIFIED:-email_verified}
      OIDC_CLAIM_GROUPS: ${OIDC_CLAIM_GROUPS:-groups}
      OIDC_CLAIM_REALM_ROLES: ${OIDC_CLAIM_REALM_ROLES:-realm_access.roles}
      OIDC_AUTO_PROVISION_DOMAINS: ${OIDC_AUTO_PROVISION_DOMAINS:-}
      OIDC_AUTO_PROVISION_GROUPS: ${OIDC_AUTO_PROVISION_GROUPS:-}
      OIDC_AUTO_PROVISION_ROLES: ${OIDC_AUTO_PROVISION_ROLES:-}
      OIDC_PLATFORM_ADMIN_ROLES: ${OIDC_PLATFORM_ADMIN_ROLES:-}
      OIDC_GROUP_CATALOG_SYNC_ENABLED: ${OIDC_GROUP_CATALOG_SYNC_ENABLED:-false}
      SSL_CERT_FILE: ${SSL_CERT_FILE:-/etc/ssl/certs/ca-certificates.crt}
      REQUESTS_CA_BUNDLE: ${REQUESTS_CA_BUNDLE:-/etc/ssl/certs/ca-certificates.crt}
    volumes:
      - ./zip:/data:ro
      - ./zim:/zim:ro
      - ./certificates:/opt/corporate-ca:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      model-gateway:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: infra/docker/python.Dockerfile
    command: python -m wikipediarag.worker
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://rag:change-me-local-only@postgres:5432/rag}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-local-minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-change-me-local-only}
      MINIO_BUCKET: ${MINIO_BUCKET:-rag-artifacts}
      OPENSEARCH_URL: ${OPENSEARCH_URL:-http://opensearch:9200}
      MODEL_GATEWAY_URL: ${MODEL_GATEWAY_URL:-http://model-gateway:8080}
      API_PUBLIC_BASE_URL: ${API_PUBLIC_BASE_URL:-http://localhost:8000}
      XBERG_URL: ${XBERG_URL:-http://xberg:8000}
      XBERG_URLS: ${XBERG_URLS:-}
      DOCLING_URL: ${DOCLING_URL:-http://docling:5001}
      DOCLING_URLS: ${DOCLING_URLS:-}
      METADATA_SERVICE_URL: ${METADATA_SERVICE_URL:-http://metadata-service:8090}
      DOCUMENT_PARSER_SERVICES_REQUIRED: ${DOCUMENT_PARSER_SERVICES_REQUIRED:-true}
      DOCUMENT_PARSER_XBERG_CONCURRENCY: ${DOCUMENT_PARSER_XBERG_CONCURRENCY:-2}
      DOCUMENT_PARSER_DOCLING_CONCURRENCY: ${DOCUMENT_PARSER_DOCLING_CONCURRENCY:-1}
      RETRIEVAL_PROFILE: ${RETRIEVAL_PROFILE:-test_mock}
      DOCUMENT_SOFT_DELETE_RETENTION_DAYS: ${DOCUMENT_SOFT_DELETE_RETENTION_DAYS:-30}
      MODELS_CONFIG_PATH: ${MODELS_CONFIG_PATH:-/app/config/models.yaml}
      RETRIEVAL_CONFIG_PATH: ${RETRIEVAL_CONFIG_PATH:-/app/config/retrieval.yaml}
      WIKI_XML_PATH: ${WIKI_XML_PATH:-/data/ruwiki-20260701-pages-articles-multistream.xml.bz2}
      WIKI_INDEX_PATH: ${WIKI_INDEX_PATH:-/data/ruwiki-20260701-pages-articles-multistream-index.txt.bz2}
      ZIM_DIR: ${ZIM_DIR:-/zim}
      ZIM_FILENAME: ${ZIM_FILENAME:-}
      KIWIX_PUBLIC_BASE_URL: ${KIWIX_PUBLIC_BASE_URL:-http://localhost:8083}
      KIWIX_INTERNAL_BASE_URL: ${KIWIX_INTERNAL_BASE_URL:-http://kiwix:8080}
      KIWIX_BOOK_NAME: ${KIWIX_BOOK_NAME:-}
      SSL_CERT_FILE: ${SSL_CERT_FILE:-/etc/ssl/certs/ca-certificates.crt}
      REQUESTS_CA_BUNDLE: ${REQUESTS_CA_BUNDLE:-/etc/ssl/certs/ca-certificates.crt}
    volumes:
      - ./zip:/data:ro
      - ./zim:/zim:ro
      - ./certificates:/opt/corporate-ca:ro
    depends_on:
      api:
        condition: service_started
      metadata-service:
        condition: service_started
      xberg:
        condition: service_started
      docling:
        condition: service_started

  ui:
    build:
      context: services/ui
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres-data:
  minio-data:
  opensearch-data:
  xberg-cache:
  docling-cache:
