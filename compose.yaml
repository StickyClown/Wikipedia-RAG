services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag}
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: valkey/valkey:8.0.2-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: quay.io/minio/minio:RELEASE.2024-07-16T23-46-41Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-local-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-change-me-local-only}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms768m -Xmx768m"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.105.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/otel/collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"

  mock-provider:
    build:
      context: .
      dockerfile: infra/docker/python.Dockerfile
    command: python -m wikipediarag.mock_provider_app
    environment:
      APP_ENV: development
    ports:
      - "8082:8080"

  model-gateway:
    build:
      context: .
      dockerfile: infra/docker/python.Dockerfile
    command: python -m wikipediarag.gateway_app
    environment:
      MODEL_PROVIDER: ${MODEL_PROVIDER:-mock}
      MOCK_PROVIDER_URL: http://mock-provider:8080
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
    ports:
      - "8081:8080"
    depends_on:
      - mock-provider

  api:
    build:
      context: .
      dockerfile: infra/docker/python.Dockerfile
    command: python -m wikipediarag.api_app
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://rag:change-me-local-only@postgres:5432/rag}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-local-minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-change-me-local-only}
      MINIO_BUCKET: ${MINIO_BUCKET:-rag-artifacts}
      OPENSEARCH_URL: ${OPENSEARCH_URL:-http://opensearch:9200}
      MODEL_GATEWAY_URL: ${MODEL_GATEWAY_URL:-http://model-gateway:8080}
      WIKI_XML_PATH: ${WIKI_XML_PATH:-/data/ruwiki-20260701-pages-articles-multistream.xml.bz2}
      WIKI_INDEX_PATH: ${WIKI_INDEX_PATH:-/data/ruwiki-20260701-pages-articles-multistream-index.txt.bz2}
    volumes:
      - ./zip:/data:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      model-gateway:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: infra/docker/python.Dockerfile
    command: python -m wikipediarag.worker
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://rag:change-me-local-only@postgres:5432/rag}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-local-minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-change-me-local-only}
      MINIO_BUCKET: ${MINIO_BUCKET:-rag-artifacts}
      OPENSEARCH_URL: ${OPENSEARCH_URL:-http://opensearch:9200}
      MODEL_GATEWAY_URL: ${MODEL_GATEWAY_URL:-http://model-gateway:8080}
      WIKI_XML_PATH: ${WIKI_XML_PATH:-/data/ruwiki-20260701-pages-articles-multistream.xml.bz2}
      WIKI_INDEX_PATH: ${WIKI_INDEX_PATH:-/data/ruwiki-20260701-pages-articles-multistream-index.txt.bz2}
    volumes:
      - ./zip:/data:ro
    depends_on:
      api:
        condition: service_started

  ui:
    build:
      context: services/ui
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres-data:
  minio-data:
  opensearch-data:
