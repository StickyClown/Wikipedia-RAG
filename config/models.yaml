models:
  embed_default:
    provider: openrouter
    model: qwen/qwen3-embedding-8b
    operation: embedding
    dimensions: 1024

  generator_fast:
    provider: openrouter
    model: qwen/qwen3.5-9b
    operation: chat
    context_window_tokens: 80000
    tokenizer: qwen3
    provider_preferences:
      require_parameters: true

  generator_main:
    provider: openrouter
    model: qwen/qwen3.6-35b-a3b
    operation: chat
    context_window_tokens: 80000
    tokenizer: qwen3
    provider_preferences:
      require_parameters: true

  verifier:
    provider: openrouter
    model: qwen/qwen3.5-9b
    operation: chat
    context_window_tokens: 80000
    tokenizer: qwen3
    provider_preferences:
      require_parameters: true

  rerank_default:
    provider: openrouter
    model: cohere/rerank-v3.5
    operation: rerank

  mock_embed_default:
    provider: mock
    model: embed_default
    operation: embedding
    dimensions: 64

  mock_generator_fast:
    provider: mock
    model: generator_fast
    operation: chat
    context_window_tokens: 80000
    tokenizer: mock_char_estimate_v1

  mock_generator_main:
    provider: mock
    model: generator_fast
    operation: chat
    context_window_tokens: 80000
    tokenizer: mock_char_estimate_v1

  mock_verifier:
    provider: mock
    model: generator_fast
    operation: chat
    context_window_tokens: 80000
    tokenizer: mock_char_estimate_v1

  mock_rerank_default:
    provider: mock
    model: rerank_default
    operation: rerank
