profiles:
  sota_mvp:
    source: zim
    version: 1
    model_aliases:
      embed: embed_default
      generator_fast: generator_fast
      generator_main: generator_main
      verifier: verifier
      rerank: rerank_default
    chunking:
      parent_child: true
      child_tokens_min: 180
      child_tokens_max: 220
      parent_tokens_min: 700
      parent_tokens_max: 900
      hard_overlap: 0
      preserve_sections: true
      preserve_paragraphs: true
    retrieval:
      bm25: true
      dense: true
      fusion: rrf
      bm25_top_k: 100
      dense_top_k: 100
      fusion_top_k: 60
      rerank: true
      rerank_top_k: 50
      query_rewrite: conditional
      query_decomposition: conditional
      top_k: 12
    postprocess:
      dedup: true
      page_quota: 2
      parent_expansion: selective
      context_packing: token_budget
      final_evidence_min: 6
      final_evidence_max: 12
      max_context_tokens: 30000
      claim_support_checker: false
      extended_search: conditional
    deep_research:
      max_questions: 8
      max_derived_per_episode: 2
      max_episodes: 12
      max_tool_calls: 12
      heartbeat_seconds: 120
      tool_timeout_seconds: 120
      deadline_seconds: 900
      report_reserve_seconds: 30
      planner_mode: deterministic
      question_budget:
        max_attempts: 3
        max_rewrites: 2
        max_depth: 3
      planner:
        model_alias: generator_fast
        max_context_tokens: 80000
        productive_target: 0.45
        soft_limit: 0.55
        hard_input_limit: 0.70
        output_reserve: 0.15
        safety_reserve: 0.15
        max_output_tokens: 12000
      verifier:
        model_alias: generator_main
        max_context_tokens: 24000
        productive_target: 0.45
        soft_limit: 0.55
        hard_input_limit: 0.70
        output_reserve: 0.10
        safety_reserve: 0.20
        max_output_tokens: 2000
      synthesis:
        model_alias: generator_main
        max_context_tokens: 80000
        productive_target: 0.45
        soft_limit: 0.55
        hard_input_limit: 0.70
        output_reserve: 0.15
        safety_reserve: 0.15
        max_output_tokens: 12000
    answer:
      citations_required: true
      deterministic_citation_validation: true
      verification:
        citation_validation: strict
        claim_verification: "off"
      insufficient_evidence_mode: true

  sota_mvp_verified:
    based_on: sota_mvp
    answer:
      verification:
        citation_validation: strict
        claim_verification: llm_strict

  test_mock:
    source: xml
    version: 1
    model_aliases:
      embed: mock_embed_default
      generator_fast: mock_generator_fast
      generator_main: mock_generator_main
      verifier: mock_verifier
      rerank: mock_rerank_default
    chunking:
      parent_child: true
      child_tokens_min: 180
      child_tokens_max: 220
      parent_tokens_min: 700
      parent_tokens_max: 900
      hard_overlap: 0
      preserve_sections: true
      preserve_paragraphs: true
    retrieval:
      bm25: true
      dense: true
      fusion: rrf
      bm25_top_k: 60
      dense_top_k: 60
      fusion_top_k: 40
      rerank: true
      rerank_top_k: 20
      query_rewrite: "off"
      query_decomposition: "off"
      top_k: 10
    postprocess:
      dedup: true
      page_quota: 3
      parent_expansion: selective
      context_packing: token_budget
      final_evidence_min: 2
      final_evidence_max: 10
      max_context_tokens: 12000
      claim_support_checker: false
      extended_search: "off"
    deep_research:
      max_questions: 8
      max_derived_per_episode: 2
      max_episodes: 12
      max_tool_calls: 12
      heartbeat_seconds: 120
      planner_mode: deterministic
      planner:
        model_alias: mock_generator_fast
        max_context_tokens: 80000
        productive_target: 0.45
        soft_limit: 0.55
        hard_input_limit: 0.70
        output_reserve: 0.15
        safety_reserve: 0.15
        max_output_tokens: 12000
      verifier:
        model_alias: mock_generator_main
        max_context_tokens: 24000
        productive_target: 0.45
        soft_limit: 0.55
        hard_input_limit: 0.70
        output_reserve: 0.10
        safety_reserve: 0.20
        max_output_tokens: 2000
      synthesis:
        model_alias: mock_generator_main
        max_context_tokens: 80000
        productive_target: 0.45
        soft_limit: 0.55
        hard_input_limit: 0.70
        output_reserve: 0.15
        safety_reserve: 0.15
        max_output_tokens: 12000
    answer:
      citations_required: true
      deterministic_citation_validation: true
      verification:
        citation_validation: strict
        claim_verification: "off"
      insufficient_evidence_mode: true

  bm25_only:
    based_on: sota_mvp
    retrieval:
      bm25: true
      dense: false
      fusion: none
      rerank: false

  rewrite_off:
    based_on: sota_mvp
    retrieval:
      query_rewrite: "off"

  parent_expansion_off:
    based_on: sota_mvp
    postprocess:
      parent_expansion: "off"

  upload_sota_mvp:
    based_on: sota_mvp
    source: upload
    postprocess:
      final_evidence_max: 10
      max_context_tokens: 12000

  upload_mock:
    based_on: test_mock
    source: upload
